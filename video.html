<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Video Player — Vvynas Vane</title>
<meta name="theme-color" content="#0A0806">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  /* Deliberately plain: no animated backdrop, no page-turn, no sparkle.
     Just a standard player, matching VideoPlayerActivity's own simplicity. */
  body { overflow-y: auto; overflow-x: hidden; background: var(--bg-primary); }
  .vp-topbar {
    display: flex; align-items: center; gap: 12px; padding: calc(14px + var(--safe-top)) 16px 12px;
    border-bottom: 1px solid var(--divider); position: sticky; top: 0; background: var(--bg-primary); z-index: 5;
  }
  .vp-topbar h1 { font-size: 15px; margin: 0; font-family: var(--font-display); color: var(--accent); letter-spacing: .04em; flex: 1; }
  .vp-stage { width: 100%; background: #000; display: flex; align-items: center; justify-content: center; }
  .vp-stage video { width: 100%; max-height: 62vh; display: block; background: #000; }
  .vp-empty-stage { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; background: #050403; }
  .vp-meta { padding: 14px 18px 4px; }
  .vp-meta .title { font-size: 15px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vp-meta .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .vp-controls { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 14px 18px 6px; }
  .vp-controls button { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text-primary); }
  .vp-controls button:hover { background: var(--ripple); }
  .vp-controls .vp-play { width: 58px; height: 58px; background: linear-gradient(180deg, var(--accent), var(--accent-dark)); color: #16110a; }
  .vp-controls svg { width: 22px; height: 22px; }
  .vp-controls .vp-play svg { width: 26px; height: 26px; }
  .vp-seek-row { display: flex; align-items: center; gap: 10px; padding: 4px 18px 16px; }
  .vp-seek-row input[type=range] { flex: 1; accent-color: var(--accent); }
  .vp-seek-row span { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 36px; }
  .vp-section-label {
    font-family: var(--font-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-muted); margin: 18px 18px 8px; display: flex; align-items: center; gap: 8px;
  }
  .vp-section-label::after { content: ""; flex: 1; height: 1px; background: var(--divider); }
  .vp-list { padding: 0 10px 40px; }
  .vp-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: var(--radius-s); cursor: pointer;
  }
  .vp-row:hover, .vp-row.active { background: var(--ripple); }
  .vp-row.active { color: var(--accent); }
  .vp-row .thumb {
    width: 56px; height: 40px; border-radius: 6px; flex: none; background: linear-gradient(145deg, var(--bg-card2), var(--bg-secondary));
    display: flex; align-items: center; justify-content: center; color: var(--text-muted);
  }
  .vp-row .thumb svg { width: 18px; height: 18px; }
  .vp-row .name { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .vp-row .kind { font-size: 10.5px; color: var(--text-muted); border: 1px solid var(--divider); border-radius: 999px; padding: 2px 8px; flex: none; }
  .vp-grant { padding: 60px 24px; text-align: center; }
  .vp-grant p { color: var(--text-secondary); font-size: 14px; max-width: 340px; margin: 10px auto 20px; line-height: 1.5; }
</style>
</head>
<body>

<header class="vp-topbar">
  <button class="icon-btn" id="backBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1>Video Player</h1>
  <button class="icon-btn" id="fullscreenBtn" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg></button>
</header>

<div id="grantSection" class="vp-grant">
  <p>Grant access to a folder to browse its video and M4A files. This uses the same on-device folder access as the music library — nothing is uploaded.</p>
  <button class="btn-primary" id="grantBtn" style="max-width:280px;margin:0 auto;">Grant Access to Videos</button>
</div>

<div id="scanningSection" class="vp-grant hidden">
  <div class="uib-orbit" style="margin:0 auto 18px;" aria-hidden="true">
    <div class="uib-particle"></div><div class="uib-particle"></div><div class="uib-particle"></div><div class="uib-particle"></div>
    <div class="uib-particle"></div><div class="uib-particle"></div><div class="uib-particle"></div><div class="uib-particle"></div>
    <div class="uib-particle"></div><div class="uib-particle"></div><div class="uib-particle"></div><div class="uib-particle"></div><div class="uib-particle"></div>
  </div>
  <p id="scanningStatus" style="color:var(--accent);font-family:var(--font-display);">Searching your folder…</p>
</div>

<div id="playerSection" class="hidden">
  <div class="vp-stage" id="vpStage">
    <div class="vp-empty-stage" id="vpEmptyStage">Select a file below to play</div>
    <video id="vpVideo" class="hidden" playsinline controls-list="nodownload"></video>
  </div>
  <div class="vp-meta">
    <div class="title" id="vpTitle">Nothing playing</div>
    <div class="sub" id="vpSub">&nbsp;</div>
  </div>
  <div class="vp-controls">
    <button id="vpPrevBtn" title="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l10-6v12z"/></svg></button>
    <button class="vp-play" id="vpPlayBtn" title="Play/Pause"><svg viewBox="0 0 24 24" fill="currentColor" id="vpPlayIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="vpNextBtn" title="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4.5 6l10 6-10 6z"/></svg></button>
  </div>
  <div class="vp-seek-row">
    <span id="vpCur">0:00</span>
    <input type="range" id="vpSeek" min="0" max="100" value="0" step="0.1">
    <span id="vpTotal">0:00</span>
  </div>

  <div class="vp-section-label" id="videoLabel">Video Files</div>
  <div class="vp-list" id="videoList"></div>
  <div class="vp-section-label" id="m4aLabel">M4A Files</div>
  <div class="vp-list" id="m4aList"></div>
</div>

<input type="file" id="vpFolderFallback" webkitdirectory multiple class="hidden">

<div id="toast"></div>

<script src="shared.js"></script>
<script src="video.js"></script>
</body>
</html>
